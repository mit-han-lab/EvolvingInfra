[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decoupled-engine"
version = "0.1.0.dev0"
description = "DecoupledEngine: SGLang-derived serving engine with symmetric prefill/decode and a shared host KV pool."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
]

# Same pins as python/pyproject.toml of the SGLang revision the engine derives
# from. Keep sorted alphabetically.
dependencies = [
  "aiohttp",
  "anthropic>=0.20.0",
  "apache-tvm-ffi==0.1.11",
  "av==16.1.0 ; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'arm64' or platform_machine == 'armv7l')",
  "blobfile==3.0.0",
  "build",
  "compressed-tensors==0.18.0",
  "cuda-python>=13.0",
  # Transitive dep of flashinfer-python, pinned because 1.6.0rc6 shipped no cp310 linux x86_64 wheel.
  "cuda-tile==1.6.0rc5",
  "datasets",
  "decord2 ; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'arm64' or platform_machine == 'armv7l')",
  "distro",
  "easydict",  # Required by remote model code (e.g. DeepSeek-OCR) loaded via trust_remote_code; validated by transformers 5.4+ check_imports
  "einops",
  "fastapi",
  "flash-attn-4>=4.0.0b18",
  "flashinfer_python[cu13]==0.6.17", # keep it aligned with jit-cache version in Dockerfile
  "gguf",
  "humming-kernels[cu13]==0.1.12",
  "interegular",
  "IPython",
  "kernels>=0.14.1,<0.15",
  "llguidance>=1.7.6,<2.0.0",
  "mistral_common>=1.11.5",
  "modelscope",
  "msgspec",
  "ninja",
  "numba==0.65.1",
  "numpy",
  "nvidia-cutlass-dsl[cu13]==4.6.2",
  "nvidia-mathdx==25.6.0",
  "nvidia-ml-py",
  "openai==2.6.1",
  "openai-harmony==0.0.4",
  "orjson",
  "outlines==0.1.11",
  "packaging",
  "partial_json_parser",
  "pillow",
  "prometheus-client>=0.20.0",
  "psutil",
  "py-spy",
  "pybase64",
  "pydantic",
  "python-multipart",
  "pyzmq>=25.1.2",
  "quack-kernels==0.6.4",
  "requests",
  "scipy",
  "sentencepiece",
  "setproctitle",
  "sgl-deep-ep==0.1.2",
  "sgl-deep-gemm==0.1.5.post3",
  "sglang-kernel==0.4.6.post1",
  "smg-grpc-servicer>=0.5.0",
  "soundfile==0.13.1",
  "tiktoken",
  "tilelang==0.1.12",
  "timm==1.0.16",
  "tokenizers==0.22.2", # 0.23.0rc0 is incompatible with transformers' CLIPTokenizer.
  "tokenspeed_mla==0.1.8",
  "tomli ; python_version < '3.11'",
  "torch==2.13.0",
  "torch_memory_saver>=0.0.9.post1",
  "torchaudio==2.11.0",
  "torchcodec==0.15.0 ; sys_platform != 'linux' or (sys_platform == 'linux' and platform_machine != 'aarch64' and platform_machine != 'arm64' and platform_machine != 'armv7l')", # Not available on Linux ARM.
  "torchvision",
  "tqdm",
  "transformers==5.12.1",
  "uvicorn",
  "uvloop",
  "watchfiles",
  "xgrammar==0.2.1",
  "xxhash",
  "zstandard",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[project.optional-dependencies]
checkpoint-engine = ["checkpoint-engine==0.1.2"]
runai = ["runai-model-streamer>=0.15.7"]

ray = [
  "ray[default]>=2.55.1",
]

tracing = [
  "opentelemetry-api",
  "opentelemetry-exporter-otlp",
  "opentelemetry-exporter-otlp-proto-grpc",
  "opentelemetry-sdk",
]

http2 = [
  "granian>=2.6.0",
]

fastokens = [
  "fastokens>=0.1.1,<0.2.0",
]

test = [
  "accelerate",
  "addict",
  "auto-round>=0.13.1",
  "av==16.1.0",
  "bitsandbytes",
  "pymupdf",
  "diff-cover",
  "expecttest",
  "granian>=2.6.0",
  "jsonlines",
  "lm-eval[api]>=0.4.9.2",
  "matplotlib",
  # 4.9.3 is what sgl-eval's math_verify grader needs (latex2sympy2_extended
  # raises ImportError on 4.7.x).
  "antlr4-python3-runtime==4.9.3",
  "pandas",
  "parameterized",
  "peft>=0.18.0",
  "polars",
  "pytest",
  "pytest-cov",
  "sentence_transformers",
  "decoupled-engine[fastokens]",
  "tabulate",
]

dev = ["decoupled-engine[test]"]

all = [
  "decoupled-engine[http2]",
  "decoupled-engine[tracing]",
]

[project.urls]
"Upstream" = "https://github.com/sgl-project/sglang"

[project.scripts]
# Same as `python -m decoupled_engine.launch_server`.
decoupled-engine = "decoupled_engine.launch_server:main"

[tool.setuptools.packages.find]
include = ["decoupled_engine*"]
exclude = ["decoupled_engine.kernels.aot*"]

[tool.setuptools.package-data]
"decoupled_engine" = [
  "srt/**/*",
  "kernels/**/*",
]

[tool.setuptools.exclude-package-data]
"decoupled_engine" = [
  "kernels/aot/*",
  "kernels/aot/**/*",
]

[tool.kernels.dependencies]
"kernels-community/sgl-flash-attn3" = 1
