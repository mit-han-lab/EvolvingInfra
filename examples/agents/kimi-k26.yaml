# Kimi-K2.6 on GB300 for coding agents: gb300/kimi-k26.yaml plus the tool-call and reasoning parsers.
base: ../gb300/kimi-k26.yaml
engine_args:
  - --tool-call-parser=kimi_k2
  - --reasoning-parser=kimi_k2
  # Each request gets its decode worker at arrival (late decode choice off).
  - --disaggregation-late-d=off
router_args:
  - --pd-late-decode=off
  - --chat-tools-tokenize        # place requests with tools on the engine's token ids
