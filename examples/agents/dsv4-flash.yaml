# DeepSeek-V4-Flash on H200 for coding agents: the engine settings of h200/dsv4-flash.yaml
# without the synthetic draft-acceptance oracle (it serves greedy replay only), plus the tool-call
# and reasoning parsers, with late decode choice off (it serves /v1/completions only).

model: /models/DeepSeek-V4-Flash
served_model_name: deepseek-v4-flash
page_size: 256
context_length: 1048576
gpus_per_worker: 4
retention: false               # KV session retention needs a FULL-only cache tree; DSV4's is FULL+SWA
engine_args:
  - --trust-remote-code
  - --moe-runner-backend=flashinfer_mxfp4
  - --mem-fraction-static=0.71
  - --max-running-requests=256
  - --chunked-prefill-size=8192
  - --max-prefill-tokens=16384
  - --swa-full-tokens-ratio=0.1
  - --hicache-write-policy=write_through
  - --speculative-algorithm=DSPARK
  - --dist-timeout=1800
  - --watchdog-timeout=900
  - --tool-call-parser=deepseekv4
  - --reasoning-parser=deepseek-v4
  - --disaggregation-late-d=off
engine_env:
  # Register the host KV tier for RDMA in 16 GB pieces (see h200/dsv4-flash.yaml).
  SGLANG_HICACHE_HOST_REGISTER_CHUNK_GB: 16
router_args:
  - --pd-late-decode=off
  - --chat-tools-tokenize        # place requests with tools on the engine's token ids
