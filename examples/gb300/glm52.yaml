# GLM-5.2 (NVFP4) on GB300, as in the paper: one TP4 worker per 4-GPU node, EAGLE speculative
# decoding, the planner on. `evolving-infra serve --config` reads the top part; `slurm/submit.py`
# also reads `benchmarks` and `slurm`.

model: /models/GLM-5.2-NVFP4
served_model_name: glm-5.2
page_size: 64
context_length: 1048576
engine_args:
  - --trust-remote-code
  - --quantization=modelopt_fp4
  - --kv-cache-dtype=fp8_e4m3
  - --attention-backend=dsa
  - --dsa-prefill-backend=trtllm
  - --dsa-decode-backend=trtllm
  - --dsa-topk-backend=sgl-kernel
  - --moe-runner-backend=flashinfer_trtllm
  - --mem-fraction-static=0.80
  - --max-running-requests=256
  - --chunked-prefill-size=8192
  - --max-prefill-tokens=8192
  - --speculative-algorithm=EAGLE
  - --speculative-num-steps=5
  - --speculative-eagle-topk=1
  - --speculative-num-draft-tokens=6
  - --speculative-moe-runner-backend=flashinfer_trtllm
  - --cuda-graph-backend-prefill=breakable
  - --cuda-graph-max-bs-prefill=8192
  - --cuda-graph-backend-decode=full
  - --cuda-graph-max-bs-decode=256
  - --sampling-backend=flashinfer
  - --dist-timeout=7200
  - --watchdog-timeout=3600
  - '--model-loader-extra-config={"enable_multithread_load": true, "num_threads": 16}'
  - --weight-loader-drop-cache-after-load
planner:
  prefill_shape_prior: glm52-gb300-tp4
  cold_start_max_wait_secs: 1    # learn from the start of the replay, as the paper's runs did

# The paper's replays (Hugging Face crmsndu/evolving-infra-traces) on 9 nodes starting as 6P3D:
# 5400 s each; the score covers [1800 s, 5400 s). `slurm/submit.py --benchmark <name>` runs one.
benchmarks:
  claude-code:                 # 126 concurrent tasks (the paper also ran 90 and 108)
    prefill_workers: 6
    workload: claude-code/cc062126-stationary-full-v1.jsonl
    concurrency: 126
    duration: 5400
    warmup: 1800
  putnam:                      # 224 concurrent agents (also 256 and 288), 16 client processes
    prefill_workers: 6
    workload: putnam/decode-heavy-100.stationary.jsonl
    shards: putnam/shards.json
    processes: 16
    concurrency: 224
    duration: 5400
    warmup: 1800
    router_args:
      - --symmetric-pd-decode-host-return    # a D returns the KV it decoded to the request's P

# For slurm/submit.py.
slurm:
  nodes: 9
  account: null
  partition: null
  time: "03:00:00"
  image: null                 # the runtime image (enroot/Pyxis), e.g. docker://... or a .sqsh file
  mounts: /models:/models
  extra_args: ""              # more sbatch options, e.g. --gpus-per-node=4
  setup: ""                   # shell commands run in the container first, e.g. activating an environment
