[graph]
all-features = true

[advisories]
yanked = "warn"
# Unmaintained advisories are not reported: the affected crates (paste through
# tokenizers, number_prefix through hf-hub's indicatif) come with the tokenizer
# dependencies, and their advisories report no vulnerability.
unmaintained = "none"
# `ignore` left empty — we want to be notified of new CVEs.
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",  # webpki-roots (through reqwest and ureq), a permissive license.
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Git deps (dynamo-tokenizers, pinned by SHA) have no semver version req and
# would otherwise trip the wildcard check.  allow-wildcard-paths exempts non-registry
# (git + path) sources so we only deny bare '*' on crates.io deps.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "allow"  # the dynamo-tokenizers git dep, pinned by SHA in Cargo.toml.
allow-git = ["https://github.com/ai-dynamo/dynamo"]
